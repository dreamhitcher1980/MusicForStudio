name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # esbuild's postinstall is blocked by npm's allow-scripts policy in this
      # project — run its installer explicitly (see AGENTS.md).
      - name: Fix esbuild install
        run: node node_modules/esbuild/install.js

      - name: Syntax-check all source modules
        run: for f in src/*.js; do node --check "$f" || exit 1; done

      # Byte-code compiles every .py in server/ (recursively, excluding caches)
      # so future server files are checked automatically.
      - name: Python server syntax check
        run: python3 -m compileall -q server -x '__pycache__|archive|deprecated' --invalidation-mode unchecked-hash

      - name: Build
        run: npx vite build

      # The committed per-song backup parts must stay checksum-clean; the
      # original 112 MB backup is deliberately not in git (100 MB upload
      # limit), so this validates every part and the self-contained merge.
      - name: Verify backup splits
        run: node merge-backup.cjs --verify && rm -f music-for-studio-backup-reassembled.json
